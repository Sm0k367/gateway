<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIC TECH AI // AFTER DARK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#000000] text-white overflow-hidden font-['Space+Grotesk']">

    <div id="setup-overlay" class="fixed inset-0 z-[1000] flex flex-col items-center justify-center bg-black transition-all duration-[1500ms]">
        <div class="mb-12 text-center px-4">
            <h1 class="text-5xl md:text-9xl font-bold tracking-[0.2em] uppercase italic font-['Syncopate'] text-white drop-shadow-[0_0_30px_rgba(255,255,255,0.4)]">
                EPIC TECH <span class="text-[#00f2ff] drop-shadow-[0_0_40px_rgba(0,242,255,0.8)]">AI</span>
            </h1>
            <p class="text-xl md:text-3xl tracking-[0.5em] text-cyan-400 mt-6 uppercase font-bold drop-shadow-[0_0_10px_rgba(0,242,255,0.5)]">Lounge After Dark</p>
            <div class="h-[2px] w-80 mx-auto bg-gradient-to-r from-transparent via-magenta-500 to-transparent my-8"></div>
            <p class="text-sm md:text-lg tracking-[0.8em] text-white/60 uppercase italic font-bold">Produced by DJ Smoke Stream</p>
        </div>

        <div id="drop-zone" class="group relative w-80 h-80 rounded-3xl border-2 border-white/20 flex items-center justify-center overflow-hidden hover:border-cyan-500 transition-all duration-700 bg-white/[0.05] backdrop-blur-xl">
            <p id="status-text" class="text-sm uppercase tracking-[0.5em] text-white group-hover:text-cyan-400 transition-colors text-center px-6 leading-relaxed font-bold">
                FEED THE ENGINE<br><span class="text-[10px] opacity-60">(SELECT AUDIO FILE)</span>
            </p>
            <input type="file" id="audio-input" accept="audio/*" class="absolute inset-0 opacity-0 cursor-pointer z-20">
        </div>

        <button id="launch-btn" class="hidden mt-12 px-20 py-6 border-2 border-cyan-400 text-cyan-400 hover:bg-cyan-400 hover:text-black transition-all duration-700 uppercase tracking-[1em] text-sm font-black bg-black/50">
            INITIATE WARP
        </button>
    </div>

    <main id="interface" class="relative w-screen h-screen opacity-0 scale-125 transition-all duration-[2500ms]">
        <canvas id="warp-canvas" class="absolute inset-0 z-0"></canvas>
        
        <div class="absolute inset-0 z-10 pointer-events-none p-12 flex flex-col justify-between">
            <div class="flex justify-between items-start">
                <div class="pointer-events-auto border-l-8 border-magenta-500 pl-8 py-4 bg-black/60 backdrop-blur-xl border-r border-y border-white/10 rounded-r-lg">
                    <h2 class="text-3xl font-bold font-['Syncopate'] italic text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]">EPIC TECH AI</h2>
                    <p class="text-xs text-cyan-400 tracking-[0.4em] uppercase font-black mt-1">AI Lounge // After Dark</p>
                </div>
                <div class="text-right pointer-events-auto font-mono text-xs text-white bg-black/60 backdrop-blur-md p-6 border border-white/10 rounded-lg space-y-2">
                    <p class="text-magenta-500 font-bold tracking-widest">SYSTEM: ACTIVE</p>
                    <p id="hz-display" class="text-cyan-400 font-black text-lg">FLOW: 0.00%</p>
                </div>
            </div>

            <div class="flex justify-between items-end pointer-events-auto">
                <div class="space-y-6">
                    <div class="flex gap-12 bg-black/40 p-4 rounded-full border border-white/5 backdrop-blur-sm">
                        <a href="https://x.com/i/communities/1763463136298807762" target="_blank" class="text-[10px] tracking-[0.5em] uppercase text-white hover:text-cyan-400 transition-all font-bold">JOIN COLLECTIVE</a>
                        <a href="https://intercom-bay.vercel.app" target="_blank" class="text-[10px] tracking-[0.5em] uppercase text-white hover:text-magenta-400 transition-all font-bold">ARCHIVE</a>
                    </div>
                </div>
                <div class="text-sm text-white/40 uppercase tracking-[1em] italic font-black bg-black/20 p-2">
                    DJ SMOKE STREAM
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
