<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM0KEN420 // ARCHITECT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#020202] text-white overflow-hidden font-['Space+Grotesk']">

    <div id="setup-overlay" class="fixed inset-0 z-[1000] flex flex-col items-center justify-center bg-[#020202] transition-all duration-1000">
        <div class="mb-12 text-center">
            <h1 class="text-5xl md:text-8xl font-bold tracking-[0.2em] uppercase italic font-['Syncopate'] text-white">
                SM0KEN<span class="text-[#00f2ff] drop-shadow-[0_0_15px_rgba(0,242,255,0.5)]">420</span>
            </h1>
            <div class="flex items-center justify-center gap-4 mt-4">
                <div class="h-[1px] w-20 bg-gradient-to-r from-transparent to-cyan-500"></div>
                <p class="text-[9px] tracking-[0.8em] text-cyan-500 uppercase font-bold">Multimedia Architect</p>
                <div class="h-[1px] w-20 bg-gradient-to-l from-transparent to-cyan-500"></div>
            </div>
        </div>

        <div id="drop-zone" class="group relative w-80 h-80 rounded-full border-2 border-white/5 flex items-center justify-center overflow-hidden hover:border-cyan-400/50 transition-all duration-1000 bg-white/[0.02] backdrop-blur-xl">
            <div class="absolute inset-0 bg-cyan-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-1000"></div>
            <div class="text-center z-10 p-10">
                <p id="status-text" class="text-[10px] uppercase tracking-[0.4em] text-gray-500 leading-loose">
                    Awaiting Signal Input...<br>
                    <span class="text-[8px] opacity-40 italic">Drop Neural Data Here</span>
                </p>
            </div>
            <input type="file" id="audio-input" accept="audio/*" class="absolute inset-0 opacity-0 cursor-pointer z-20">
        </div>

        <button id="launch-btn" class="hidden mt-12 px-14 py-4 border border-cyan-400 text-cyan-400 hover:bg-cyan-400 hover:text-black transition-all duration-700 uppercase tracking-[1em] text-[10px] font-bold bg-transparent">
            Execute Protocol
        </button>
    </div>

    <main id="interface" class="relative w-screen h-screen opacity-0 transition-all duration-[2500ms]">
        <canvas id="aether-canvas" class="absolute inset-0 z-0"></canvas>
        
        <div class="absolute inset-0 z-10 pointer-events-none p-8 md:p-16 flex flex-col justify-between">
            <div class="flex justify-between items-start">
                <div class="pointer-events-auto border-l-2 border-cyan-500 pl-6">
                    <h2 class="text-2xl font-bold font-['Syncopate'] italic tracking-tighter text-white">SM0KEN420</h2>
                    <p class="text-[9px] text-cyan-500 tracking-[0.5em] uppercase font-black">Core Architect // OS V.4</p>
                </div>
                <div class="text-right pointer-events-auto font-mono text-[9px] text-white/40 space-y-2 bg-black/40 backdrop-blur-md p-4 border border-white/5">
                    <p class="text-cyan-400">ENCRYPTION: ACTIVE</p>
                    <p id="hz-display">NEURAL LOAD: 0.00%</p>
                </div>
            </div>

            <div class="flex justify-between items-end pointer-events-auto">
                <div class="flex flex-col gap-6">
                    <div class="group relative">
                        <div class="h-40 w-[1px] bg-gradient-to-t from-cyan-500 via-cyan-500/20 to-transparent"></div>
                        <div class="absolute bottom-0 left-0 w-40 h-[1px] bg-gradient-to-r from-cyan-500 to-transparent"></div>
                    </div>
                    <div class="flex flex-col gap-4 pl-4">
                        <a href="https://x.com/i/communities/1763463136298807762" target="_blank" class="text-[9px] tracking-[0.3em] uppercase text-white/50 hover:text-cyan-400 transition-all">Join Collective</a>
                        <a href="https://intercom-bay.vercel.app" target="_blank" class="text-[9px] tracking-[0.3em] uppercase text-white/50 hover:text-cyan-400 transition-all">Thought Archive</a>
                    </div>
                </div>
                <div class="text-[9px] text-white/20 uppercase tracking-[1em] italic font-bold">
                    Architectures Infinite
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
