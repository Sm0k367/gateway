<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIC TECH AI // AFTER DARK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#010101] text-white overflow-hidden font-['Space+Grotesk']">

    <div id="setup-overlay" class="fixed inset-0 z-[1000] flex flex-col items-center justify-center bg-[#010101] transition-all duration-1000">
        <div class="mb-12 text-center px-4">
            <h1 class="text-4xl md:text-7xl font-bold tracking-[0.1em] uppercase italic font-['Syncopate'] text-white">
                EPIC TECH <span class="text-[#00f2ff] drop-shadow-[0_0_20px_rgba(0,242,255,0.8)]">AI</span>
            </h1>
            <p class="text-[12px] md:text-[16px] tracking-[0.5em] text-cyan-400/80 mt-4 uppercase font-bold">AI Lounge After Dark</p>
            <div class="h-[1px] w-full bg-gradient-to-r from-transparent via-magenta-500 via-cyan-500 to-transparent my-6 opacity-50"></div>
            <p class="text-[9px] tracking-[0.6em] text-white/40 uppercase italic">Curated by DJ Smoke Stream</p>
        </div>

        <div id="drop-zone" class="group relative w-72 h-72 rounded-full border border-white/10 flex items-center justify-center overflow-hidden hover:border-magenta-500/50 transition-all duration-1000 bg-white/[0.01] backdrop-blur-2xl shadow-[0_0_50px_rgba(0,0,0,1)]">
            <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500/10 to-magenta-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-1000"></div>
            <div class="text-center z-10">
                <p id="status-text" class="text-[10px] uppercase tracking-[0.4em] text-cyan-300 font-bold drop-shadow-md">
                    INITIALIZE SIGNAL<br>
                    <span class="text-[8px] opacity-40 font-normal">Drop Audio to Morph</span>
                </p>
            </div>
            <input type="file" id="audio-input" accept="audio/*" class="absolute inset-0 opacity-0 cursor-pointer z-20">
        </div>

        <button id="launch-btn" class="hidden mt-12 px-12 py-4 border border-magenta-500 text-magenta-400 hover:bg-magenta-500 hover:text-white transition-all duration-700 uppercase tracking-[0.8em] text-[10px] font-bold bg-transparent">
            Enter The After Dark
        </button>
    </div>

    <main id="interface" class="relative w-screen h-screen opacity-0 transition-all duration-[2000ms]">
        <canvas id="aether-canvas" class="absolute inset-0 z-0"></canvas>
        
        <div class="absolute inset-0 z-10 pointer-events-none p-8 flex flex-col justify-between">
            <div class="flex justify-between items-start">
                <div class="pointer-events-auto border-l-4 border-magenta-600 pl-6 bg-black/20 p-4 backdrop-blur-sm">
                    <h2 class="text-xl font-bold font-['Syncopate'] italic tracking-tighter text-white">EPIC TECH AI</h2>
                    <p class="text-[9px] text-cyan-400 tracking-[0.4em] uppercase font-black">AI LOUNGE // AFTER DARK</p>
                </div>
                <div class="text-right pointer-events-auto font-mono text-[9px] text-white/50 space-y-2">
                    <p class="text-magenta-500 font-bold">PRODUCED BY DJ SMOKE STREAM</p>
                    <p id="hz-display" class="text-cyan-400">PULSE: 0.00%</p>
                </div>
            </div>

            <div class="flex justify-between items-end pointer-events-auto">
                <div class="flex flex-col gap-6">
                    <div class="flex flex-col gap-3 pl-4 border-l border-white/10">
                        <a href="https://x.com/i/communities/1763463136298807762" target="_blank" class="text-[9px] tracking-[0.3em] uppercase text-white/40 hover:text-cyan-400 transition-all">Join The Tribe</a>
                        <a href="https://intercom-bay.vercel.app" target="_blank" class="text-[9px] tracking-[0.3em] uppercase text-white/40 hover:text-magenta-400 transition-all">Inside The Mind</a>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] text-cyan-500/40 uppercase tracking-[1.2em] font-bold mb-1">LIVE AUDIO ANALYSIS</div>
                    <div class="text-[8px] text-white/20 uppercase tracking-[0.5em]">SMOKE STREAM ARCHITECTURE</div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
