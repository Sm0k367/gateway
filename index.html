<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIC TECH AI // AFTER DARK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#000000] text-white overflow-hidden font-['Space+Grotesk']">

    <div id="setup-overlay" class="fixed inset-0 z-[1000] flex flex-col items-center justify-center bg-black transition-all duration-[1500ms]">
        <div class="mb-12 text-center px-4">
            <h1 class="text-4xl md:text-7xl font-bold tracking-[0.2em] uppercase italic font-['Syncopate'] text-white">
                EPIC TECH <span class="text-[#00f2ff] drop-shadow-[0_0_15px_rgba(0,242,255,0.6)]">AI</span>
            </h1>
            <p class="text-[12px] md:text-[14px] tracking-[0.5em] text-cyan-400 mt-4 uppercase font-bold">Lounge After Dark // Warp Protocol</p>
            <div class="h-[1px] w-64 mx-auto bg-gradient-to-r from-transparent via-magenta-500 to-transparent my-6"></div>
            <p class="text-[9px] tracking-[0.8em] text-white/30 uppercase italic font-bold">Produced by DJ Smoke Stream</p>
        </div>

        <div id="drop-zone" class="group relative w-64 h-64 rounded-2xl border border-white/10 flex items-center justify-center overflow-hidden hover:border-cyan-500/50 transition-all duration-700 bg-white/[0.02] backdrop-blur-md">
            <p id="status-text" class="text-[9px] uppercase tracking-[0.5em] text-gray-400 group-hover:text-cyan-400 transition-colors text-center px-4">
                Feed the Engine<br><span class="opacity-40">(Audio File)</span>
            </p>
            <input type="file" id="audio-input" accept="audio/*" class="absolute inset-0 opacity-0 cursor-pointer z-20">
        </div>

        <button id="launch-btn" class="hidden mt-10 px-14 py-4 border border-cyan-400 text-cyan-400 hover:bg-cyan-400 hover:text-black transition-all duration-700 uppercase tracking-[1em] text-[10px] font-bold">
            Initiate Warp
        </button>
    </div>

    <main id="interface" class="relative w-screen h-screen opacity-0 scale-125 transition-all duration-[2500ms]">
        <canvas id="warp-canvas" class="absolute inset-0 z-0"></canvas>
        
        <div class="absolute inset-0 z-10 pointer-events-none p-10 flex flex-col justify-between">
            <div class="flex justify-between items-start">
                <div class="pointer-events-auto border-l-2 border-magenta-500 pl-6 py-2 bg-black/40 backdrop-blur-md">
                    <h2 class="text-xl font-bold font-['Syncopate'] italic text-white">EPIC TECH AI</h2>
                    <p class="text-[8px] text-cyan-400 tracking-[0.4em] uppercase font-black">AI Lounge // After Dark</p>
                </div>
                <div class="text-right pointer-events-auto font-mono text-[8px] text-white/40 space-y-1">
                    <p class="text-magenta-500">SYSTEM: ACTIVE</p>
                    <p id="hz-display">FLOW: 0.00%</p>
                </div>
            </div>

            <div class="flex justify-between items-end pointer-events-auto">
                <div class="space-y-4">
                    <div class="flex gap-8">
                        <a href="https://x.com/i/communities/1763463136298807762" target="_blank" class="text-[8px] tracking-[0.4em] uppercase text-white/30 hover:text-cyan-400 transition-all">Collective</a>
                        <a href="https://intercom-bay.vercel.app" target="_blank" class="text-[8px] tracking-[0.4em] uppercase text-white/30 hover:text-magenta-400 transition-all">Archive</a>
                    </div>
                </div>
                <div class="text-[8px] text-white/20 uppercase tracking-[1em] italic">
                    Architected by DJ Smoke Stream
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
